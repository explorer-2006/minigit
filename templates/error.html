{% extends "base.html" %}
{% block title %}Error — MiniGit{% endblock %}

{% block content %}
<div class="card" style="max-width:600px;margin:40px auto">
  <div class="card-header" style="background:var(--red-bg);color:var(--red);border-color:rgba(244,63,94,0.3)">
    <div style="display:flex;align-items:center;gap:8px">
      <span>⚠️</span>
      <span>Repository Error</span>
    </div>
  </div>
  <div class="card-body" style="text-align:center;padding:36px 20px">
    <div style="font-size:48px;margin-bottom:16px">🔍</div>
    <h3 style="font-size:18px;font-weight:700;margin-bottom:8px;color:#fff">
      {{ message if message else 'The requested resource was not found' }}
    </h3>
    <p style="color:var(--text-muted);font-size:13px;margin-bottom:24px">
      Please check the URL or return to the main dashboard.
    </p>
    <a href="/" class="btn btn-accent">
      <span>←</span> Back to Repositories
    </a>
  </div>
</div>
{% endblock %}
