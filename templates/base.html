<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}MiniGit — Data Structures Git Engine{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Palette */
      --bg:             #090d16;
      --surface:        #0f172a;
      --surface-card:   #1e293b;
      --surface-hover:  #273549;
      --surface-elevated: #243044;
      --border:         #334155;
      --border-focus:   #38bdf8;
      --border-subtle:  #1e293b;
      
      /* Text */
      --text:           #f8fafc;
      --text-muted:     #94a3b8;
      --text-subtle:    #64748b;
      
      /* Accents */
      --accent:         #38bdf8;
      --accent-glow:    rgba(56, 189, 248, 0.25);
      --accent-hover:   #0284c7;
      
      /* Status */
      --green:          #22c55e;
      --green-glow:     rgba(34, 197, 94, 0.25);
      --green-bg:       rgba(34, 197, 94, 0.12);
      
      --red:            #f43f5e;
      --red-glow:       rgba(244, 63, 94, 0.25);
      --red-bg:         rgba(244, 63, 94, 0.12);
      
      --yellow:         #fbbf24;
      --yellow-bg:      rgba(251, 191, 36, 0.12);
      
      --purple:         #c084fc;
      --purple-bg:      rgba(192, 132, 252, 0.12);

      --radius:         8px;
      --radius-lg:      12px;
      --radius-sm:      6px;

      --font-sans:      'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono:      'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;

      --shadow-sm:      0 1px 2px 0 rgba(0, 0, 0, 0.3);
      --shadow:         0 4px 12px 0 rgba(0, 0, 0, 0.4);
      --shadow-lg:      0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
    }

    /* ── Navigation ── */
    nav {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .logo {
      font-size: 18px;
      font-weight: 800;
      color: #fff;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: -0.02em;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, var(--accent), #2563eb);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      color: #fff;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .logo span {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: color 0.15s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .nav-link:hover { color: var(--text); }
    .nav-link.active { color: var(--accent); }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .server-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      color: var(--green);
      background: var(--green-bg);
      border: 1px solid rgba(34, 197, 94, 0.25);
      padding: 3px 10px;
      border-radius: 20px;
    }

    .status-pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }

    /* ── Layout ── */
    .container {
      max-width: 1180px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 24px;
      flex: 1;
    }

    /* ── Typography & Headers ── */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .page-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 12px;
    }

    .breadcrumb a {
      color: var(--accent);
      text-decoration: none;
      transition: color 0.15s;
    }

    .breadcrumb a:hover {
      text-decoration: underline;
    }

    .breadcrumb-sep {
      color: var(--text-subtle);
    }

    /* ── Tabs Bar ── */
    .tabs {
      display: flex;
      gap: 6px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
      padding-bottom: 2px;
    }

    .tab {
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      text-decoration: none;
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
      border-bottom: 2px solid transparent;
      margin-bottom: -3px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
    }

    .tab:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.03);
    }

    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
      background: rgba(56, 189, 248, 0.06);
    }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
      margin-bottom: 20px;
    }

    .card-header {
      padding: 16px 20px;
      background: var(--surface-card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      font-size: 14px;
      color: #fff;
    }

    .card-body {
      padding: 20px;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      font-family: var(--font-sans);
      text-decoration: none;
      border: 1px solid var(--border);
      color: var(--text);
      background: var(--surface-card);
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.18s ease;
      user-select: none;
    }

    .btn:hover {
      background: var(--surface-hover);
      border-color: #475569;
      color: #fff;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-accent {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 0 14px var(--accent-glow);
    }

    .btn-accent:hover {
      background: linear-gradient(135deg, #0ea5e9, #3b82f6);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
      color: #ffffff;
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 12px;
      border-radius: var(--radius-sm);
    }

    /* ── Badges ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      font-family: var(--font-mono);
      letter-spacing: 0.02em;
    }

    .badge-green {
      background: var(--green-bg);
      color: var(--green);
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    .badge-blue {
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .badge-yellow {
      background: var(--yellow-bg);
      color: var(--yellow);
      border: 1px solid rgba(251, 191, 36, 0.3);
    }

    .badge-purple {
      background: var(--purple-bg);
      color: var(--purple);
      border: 1px solid rgba(192, 132, 252, 0.3);
    }

    .badge-red {
      background: var(--red-bg);
      color: var(--red);
      border: 1px solid rgba(244, 63, 94, 0.3);
    }

    /* ── Commit Rows & Timeline ── */
    .commit-timeline {
      display: flex;
      flex-direction: column;
    }

    .commit-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      color: inherit;
      transition: all 0.15s ease;
      background: transparent;
    }

    .commit-row:last-child {
      border-bottom: none;
    }

    .commit-row:hover {
      background: rgba(56, 189, 248, 0.04);
    }

    .commit-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--surface-card);
      border: 2px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 12px;
      color: var(--accent);
      flex-shrink: 0;
      transition: all 0.15s ease;
    }

    .commit-row:hover .commit-avatar {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .commit-main {
      flex: 1;
      min-width: 0;
    }

    .commit-msg {
      font-weight: 700;
      font-size: 14px;
      color: #fff;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .commit-meta {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .commit-meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .commit-id-pill {
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--surface-card);
      border: 1px solid var(--border);
      color: var(--accent);
      flex-shrink: 0;
    }

    /* ── Diff View ── */
    .diff-file {
      margin-bottom: 24px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .diff-filename {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      padding: 10px 16px;
      background: var(--surface-card);
      border-bottom: 1px solid var(--border);
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .diff-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-mono);
      font-size: 12px;
      background: var(--surface);
    }

    .diff-table td {
      padding: 4px 12px;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .diff-gutter {
      width: 32px;
      user-select: none;
      text-align: center;
      color: var(--text-subtle);
      font-weight: 700;
      border-right: 1px solid rgba(255, 255, 255, 0.05);
    }

    .diff-add {
      background: var(--green-bg);
      color: #86efac;
    }

    .diff-add .diff-gutter {
      color: var(--green);
      background: rgba(34, 197, 94, 0.2);
    }

    .diff-rem {
      background: var(--red-bg);
      color: #fda4af;
    }

    .diff-rem .diff-gutter {
      color: var(--red);
      background: rgba(244, 63, 94, 0.2);
    }

    .diff-ctx {
      color: #cbd5e1;
    }

    /* ── Empty State ── */
    .empty {
      text-align: center;
      padding: 56px 24px;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 40px;
      margin-bottom: 14px;
      display: block;
      opacity: 0.85;
    }

    .empty h3 {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }

    .empty p {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* ── Visualizer Panels ── */
    .viz-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .viz-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .viz-panel-header h3 {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .viz-canvas-container {
      background: #070b13;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      overflow-x: auto;
      overflow-y: hidden;
      position: relative;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--surface);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 20px;
      text-align: center;
      font-size: 12px;
      color: var(--text-subtle);
      background: var(--surface);
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-left">
    <a href="/" class="logo">
      <div class="logo-icon">⬡</div>
      <div>Mini<span>Git</span></div>
    </a>
    <div class="nav-links">
      <a href="/" class="nav-link">📁 Repositories</a>
    </div>
  </div>
  <div class="nav-right">
    <div class="server-status">
      <span class="status-pulse"></span>
      <span>MiniGit Engine Active</span>
    </div>
  </div>
</nav>

<div class="container">
  {% block content %}{% endblock %}
</div>

<footer>
  MiniGit Engine • Data Structures Project (Linked Lists, Binary/N-ary Trees, LIFO Stack, Dynamic Programming LCS)
</footer>

</body>
</html>
